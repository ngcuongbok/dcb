<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Đăng nhập quản trị | DiciiBooth</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ec;color:#26372a;font:16px system-ui,sans-serif}main{background:white;border:1px solid #dce3d7;border-radius:14px;padding:30px;width:min(92vw,400px)}h1{font-size:1.45rem;margin:0 0 8px}p{color:#617165;line-height:1.5}label{display:block;font-weight:600;margin:18px 0 6px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #bac9ba}button{margin-top:22px;color:#fff;background:#285c3b;cursor:pointer;border-color:#285c3b}#error{color:#ad342d;min-height:1.5em}</style></head><body><main><h1>Đăng nhập quản trị</h1><p>DiciiBooth · Báo cáo cửa hàng</p><form id="form"><label for="username">Tài khoản</label><input id="username" autocomplete="username" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button>Đăng nhập</button><p id="error" role="alert"></p></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter, error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(r.ok){location.replace('/admin/');return}error.textContent=r.status===429?'Bạn đã thử quá nhiều lần. Vui lòng đợi 15 phút.':'Tài khoản hoặc mật khẩu không đúng.'}catch{error.textContent='Không kết nối được. Vui lòng thử lại.'}finally{b.disabled=false}}</script></body></html>
